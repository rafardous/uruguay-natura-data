name: Mantenimiento editorial

on:
  schedule:
    - cron: '20 3 * * *'
    - cron: '40 3 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup-and-cleanup:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NaturaUY-admin
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      BACKUP_ENCRYPTION_PASSWORD: ${{ secrets.BACKUP_ENCRYPTION_PASSWORD }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PGHOST: aws-0-sa-east-1.pooler.supabase.com
      PGPORT: '5432'
      PGUSER: postgres.xbnbfekcxrkgteuijbzh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: NaturaUY-admin/package-lock.json
      - run: npm ci
      - name: Respaldo lógico cifrado
        run: |
          set -euo pipefail
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          : "${SUPABASE_DB_URL:?Falta SUPABASE_DB_URL}"
          : "${BACKUP_ENCRYPTION_PASSWORD:?Falta BACKUP_ENCRYPTION_PASSWORD}"
          export PGPASSWORD="$(node -e 'process.stdout.write(decodeURIComponent(new URL(process.env.SUPABASE_DB_URL).password))')"
          pg_dump --dbname=postgres --schema=public --schema=private --no-owner --no-acl | gzip | openssl enc -aes-256-cbc -salt -pbkdf2 -pass env:BACKUP_ENCRYPTION_PASSWORD -out "editorial-$(date -u +%Y%m%d).sql.gz.enc"
          test "$(wc -c < "editorial-$(date -u +%Y%m%d).sql.gz.enc")" -gt 1024
      - name: Conservar respaldo cifrado durante siete días
        uses: actions/upload-artifact@v4
        with:
          name: editorial-${{ github.run_id }}
          path: NaturaUY-admin/editorial-*.sql.gz.enc
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - run: npm run media:cleanup

  verify-media:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '40 3 1 * *'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NaturaUY-admin
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: NaturaUY-admin/package-lock.json
      - run: npm ci
      - run: npm run media:verify
