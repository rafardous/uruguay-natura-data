project_id = "natura-uy-editorial"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://127.0.0.1:5173/**", "naturauy://**"]
enable_signup = true

[auth.email]
enable_signup = false
enable_confirmations = true
max_frequency = "1m"
otp_length = 8

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[storage]
enabled = true
file_size_limit = "50MiB"

[functions.invite-user]
verify_jwt = true

[functions.set-user-active]
verify_jwt = true

[functions.request-media-processing]
verify_jwt = true

[functions.request-catalog-publish]
verify_jwt = true
